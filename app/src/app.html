<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="%sveltekit.assets%/fonts/ibm-plex-sans-latin-400-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="%sveltekit.assets%/fonts/ibm-plex-mono-latin-400-normal.woff2" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="Plyvio — offline-first chess library and analysis." />
  <title>Plyvio</title>
  <script>
    // Apply persisted theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('plyvio.theme');
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var l = localStorage.getItem('plyvio.locale');
      if (l) document.documentElement.lang = l;
    } catch (e) {}
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display:contents">%sveltekit.body%</div>
</body>
</html>
